[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ris-system-bis"
version = "0.1.0"
description = "RIS-aided channel estimation with a neural network, inspired by the referenced paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11.1",
  "numpy>=1.26",
  "scipy>=1.13",
  "torch>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false
